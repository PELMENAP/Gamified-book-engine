name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Documentation matches the code
        run: pnpm check:docs
      - name: Package boundaries
        run: pnpm check:boundaries
      - name: Code guard
        run: pnpm check:guard
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build the probe
        run: pnpm --filter @gbe/probe build
      - name: Size budget
        run: node tools/budget.ts dist/probe
      - name: No plaintext in dist
        run: node tools/leakcheck.ts dist --require
